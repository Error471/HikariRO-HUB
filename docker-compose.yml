services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'true'
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '300',
        '1',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'volatile-ttl',
      ]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
