<!-- Estructura de ?module=cartaslog observada el 03/10/2026 (datos de ejemplo) -->
<html>
  <head>
    <title>HikariRO: Card Album</title>
  </head>
  <body>
    <header><a href="/?module=account&amp;action=logout">Salir</a></header>
    <div class="hro-card-album">
      <div class="hro-card-album__progress">
        <div class="hro-card-album__progress-info">
          <span>2 de 1.468 obtenidas</span><span>0,14%</span>
        </div>
        <div class="hro-card-album__progress-track">
          <div class="hro-card-album__progress-bar" style="width: 0.14%"></div>
        </div>
      </div>
      <div class="hro-card-album__toolbar">
        <div class="hro-card-album__results">
          <p class="info-text">
            Se han encontrado un total de 43 registro(s) en 3 página(s). Mostrando el/los
            resultado(s) 21-40.
          </p>
        </div>
      </div>
      <div class="hro-card-album__grid">
        <article class="hro-card-album__card is-found">
          <a
            class="hro-card-album__image-link"
            href="?module=item&amp;action=view&amp;id=4001"
            title="Ver Poring Card"
            ><img
              class="hro-card-album__image"
              src="data/items/images/4001.png"
              alt="Poring Card"
              loading="lazy"
              onerror="this.src = 'data/items/icons/4001.png'"
          /></a>
          <div class="hro-card-album__body">
            <h3 class="hro-card-album__name">Poring Card</h3>
            <div class="hro-card-album__meta"><span>ID: 4001</span><span>Obtenida</span></div>
          </div>
        </article>
        <article class="hro-card-album__card is-missing">
          <a
            class="hro-card-album__image-link"
            href="?module=item&amp;action=view&amp;id=4003"
            title="Ver Pupa Card"
            ><img class="hro-card-album__image" src="data/items/images/4003.png" alt="Pupa Card"
          /></a>
          <div class="hro-card-album__body">
            <h3 class="hro-card-album__name">Pupa Card</h3>
            <div class="hro-card-album__meta"><span>ID: 4003</span><span>No obtenida</span></div>
          </div>
        </article>
        <article class="hro-card-album__card is-found">
          <a
            class="hro-card-album__image-link"
            href="?module=item&amp;action=view&amp;id=4005"
            title="Ver Santa Poring Card"
            ><img
              class="hro-card-album__image"
              src="data/items/images/4005.png"
              alt="Santa Poring Card"
          /></a>
          <div class="hro-card-album__body">
            <h3 class="hro-card-album__name">Santa Poring Card</h3>
            <div class="hro-card-album__meta"><span>ID: 4005</span><span>Obtenida</span></div>
          </div>
        </article>
      </div>
      <div class="hro-card-album__pagination">
        <div class="pages">
          <a href="/?module=cartaslog&amp;p=1" class="page-num">1</a> |
          <a class="page-num current-page">2</a> |
          <a href="/?module=cartaslog&amp;p=3" class="page-num">3</a>
        </div>
      </div>
    </div>
  </body>
</html>
