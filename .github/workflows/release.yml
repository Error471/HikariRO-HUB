# Publica una versión nueva de la app de escritorio en GitHub Releases.
# Desde GitHub: Actions → "Publicar versión" → Run workflow → escribe la versión (p. ej. 0.2.0).
# Las apps instaladas la descargan solas y se actualizan al cerrarse.
name: Publicar versión
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión nueva (formato 1.2.3, mayor que la última publicada)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el formato de la versión
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La versión debe tener el formato 1.2.3 (recibido: $VERSION)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Poner la versión
        env:
          VERSION: ${{ inputs.version }}
        run: node apps/desktop/scripts/set-version.mjs "$env:VERSION"
      - run: pnpm --filter @hikari-hub/web build
      - run: pnpm --filter @hikari-hub/desktop build
      # Se sube todo a un borrador y se publica al final: así la release nunca queda a medias.
      - name: Crear el instalador y subirlo a un borrador
        working-directory: apps/desktop
        # Bash: PowerShell parte los argumentos -c.publish.*
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec electron-builder --win --x64 --publish always
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=draft
      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          for file in latest.yml "Hikari-Hub-Setup-$VERSION.exe" "Hikari-Hub-Setup-$VERSION.exe.blockmap"; do
            gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$file" || { echo "::error::Falta $file en la release"; exit 1; }
          done
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest --target "$GITHUB_SHA"
